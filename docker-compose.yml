# ==========================================================================
# API Server Docker Compose (Production - Coolify)
# ==========================================================================
#
# This file runs ONLY the API server and Redis.
# Workers should be deployed separately using docker-compose.worker.yml
# on dedicated worker servers.
#
# This separation allows:
#   - Redeploy API without interrupting running jobs
#   - Scale workers independently
#   - Workers can run on different servers
#
# For local development with everything together, use:
#   docker-compose -f docker-compose.full.yml up -d
#
# ==========================================================================

services:
  # ==========================================================================
  # Database migrations (one-off job if you're using Supabase)
  # ==========================================================================
  migrate:
    profiles:
      - migrate
    build:
      context: .
      args:
        SUPABASE_URL: ${SUPABASE_URL}
        SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
        PRIVY_APP_ID: ${PRIVY_APP_ID:-}
        CORALGPT_HERO_VIDEO_URL: ${CORALGPT_HERO_VIDEO_URL:-}
    container_name: bioagents-migrate
    env_file:
      - .env
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - supabase_tmp:/app/supabase/.temp
    command: >
      sh -lc '
        set -eu
        mkdir -p /app/supabase/.temp
        echo "Supabase CLI: $(supabase --version)"
        # The direct DB URL (db.*.supabase.co) resolves to IPv6 only and the
        # container has no IPv6 connectivity, so we override with the IPv4
        # pooler URL when SUPABASE_DB_URL is provided.
        DB_URL="${SUPABASE_DB_URL:-}"
        if [ -z "$DB_URL" ]; then
          DB_URL="$SUPABASE_FULL_URL"
        fi
        export DB_URL
        echo "Using DB host: $(echo "$DB_URL" | sed -E "s|.*@([^/]+).*|\\1|")"
        supabase db push --db-url "$DB_URL"
      '
    restart: "no"

  # ==========================================================================
  # API Server - Handles HTTP requests and WebSocket connections
  # ==========================================================================
  bioagents:
    image: bioagents-bioagents
    build:
      context: .
      args:
        SUPABASE_URL: ${SUPABASE_URL}
        SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
        PRIVY_APP_ID: ${PRIVY_APP_ID:-}
        CORALGPT_HERO_VIDEO_URL: ${CORALGPT_HERO_VIDEO_URL:-}
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_DATE: ${BUILD_DATE:-}
        SKIP_CLIENT_BUILD: ${SKIP_CLIENT_BUILD:-0}
    container_name: bioagents-api
    expose:
      - "${PORT:-3000}"

    volumes:
      # Bind mount so local papers in ./docs (gitignored) are visible in the container
      - ./docs:/app/docs
      - bioagents-images:/app/client/public/images

    ports:
      - "0.0.0.0:${PORT:-3000}:3000"

    environment:
      # CRITICAL: env_file (.env) is the SINGLE SOURCE OF TRUTH for all
      # non-default vars. Listing a var here with `${VAR:-}` (empty default)
      # OVERRIDES env_file with an empty string at runtime — which makes the
      # running container see the var as missing even though it's in .env.
      # Rule of thumb: only list vars in `environment:` if you need a
      # Compose-time default that differs from .env, or if the var must
      # always be present (PORT, NODE_ENV, etc.).
      #
      # REMOVED: OPENSCHOLAR_API_URL was here with ${OPENSCHOLAR_API_URL:-}
      # but that overrode the value from .env at runtime, making the worker
      # see it as empty and skip OpenScholar. Now read from .env only.
      # EDISON_API_URL + EDISON_API_KEY must NEVER be added here for the
      # same reason — they come from .env only.
      - REPLY_LLM_PROVIDER=${REPLY_LLM_PROVIDER:-openai}
      - REPLY_LLM_MODEL=${REPLY_LLM_MODEL:-gpt-5.4}
      - HYP_LLM_PROVIDER=${HYP_LLM_PROVIDER:-openai}
      - HYP_LLM_MODEL=${HYP_LLM_MODEL:-gpt-5.4}
      - PLANNING_LLM_PROVIDER=${PLANNING_LLM_PROVIDER:-openai}
      - PLANNING_LLM_MODEL=${PLANNING_LLM_MODEL:-gpt-5.4}
      - STRUCTURED_LLM_PROVIDER=${STRUCTURED_LLM_PROVIDER:-openai}
      - STRUCTURED_LLM_MODEL=${STRUCTURED_LLM_MODEL:-gpt-5.4}
      - DISCOVERY_LLM_PROVIDER=${DISCOVERY_LLM_PROVIDER:-openai}
      - DISCOVERY_LLM_MODEL=${DISCOVERY_LLM_MODEL:-gpt-5.4}
      - REFLECTION_LLM_PROVIDER=${REFLECTION_LLM_PROVIDER:-openai}
      - REFLECTION_LLM_MODEL=${REFLECTION_LLM_MODEL:-gpt-5.4}
      - PAPER_GEN_LLM_PROVIDER=${PAPER_GEN_LLM_PROVIDER:-openai}
      - PAPER_GEN_LLM_MODEL=${PAPER_GEN_LLM_MODEL:-gpt-5.4}

      # Embedding Configuration
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-openai}
      - TEXT_EMBEDDING_MODEL=${TEXT_EMBEDDING_MODEL:-text-embedding-3-large}

      # Vector Search & RAG Configuration
      - CHUNK_SIZE=${CHUNK_SIZE:-2000}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-200}
      - VECTOR_SEARCH_LIMIT=${VECTOR_SEARCH_LIMIT:-20}
      - RERANK_FINAL_LIMIT=${RERANK_FINAL_LIMIT:-5}
      - USE_RERANKING=${USE_RERANKING:-true}
      - KNOWLEDGE_DOCS_PATH=${KNOWLEDGE_DOCS_PATH:-docs}
      - SIMILARITY_THRESHOLD=${SIMILARITY_THRESHOLD:-0.45}
      - RERANKER_SCORE_THRESHOLD=${RERANKER_SCORE_THRESHOLD:-0}

      # Authentication
      - BIOAGENTS_SECRET=${BIOAGENTS_SECRET:-}
      - AUTH_MODE=${AUTH_MODE:-none}
      - UI_PASSWORD=${UI_PASSWORD:-}
      - PRIVY_APP_ID=${PRIVY_APP_ID:-}
      - PRIVY_APP_SECRET=${PRIVY_APP_SECRET:-}
      - CORALGPT_HERO_VIDEO_URL=${CORALGPT_HERO_VIDEO_URL:-}

      # Server Configuration
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production

      # Job Queue Configuration (connects to Redis)
      - USE_JOB_QUEUE=${USE_JOB_QUEUE:-true}

      # Chat Agent Loop
      - CHAT_AGENT_QUEUE_ENABLED=${CHAT_AGENT_QUEUE_ENABLED:-false}
      - CHAT_AGENT_MODEL=${CHAT_AGENT_MODEL:-claude-sonnet-4-6}
      - CHAT_AGENT_MAX_TOOL_CALLS=${CHAT_AGENT_MAX_TOOL_CALLS:-10}
      - CHAT_AGENT_MAX_TOKENS=${CHAT_AGENT_MAX_TOKENS:-4096}
      - CHAT_TOOL_TIMEOUT_MS=${CHAT_TOOL_TIMEOUT_MS:-30000}

      - REDIS_URL=${REDIS_URL:-redis://redis:6379}

      # Queue concurrency (for rate limiting info)
      - CHAT_QUEUE_CONCURRENCY=${CHAT_QUEUE_CONCURRENCY:-5}
      - DEEP_RESEARCH_QUEUE_CONCURRENCY=${DEEP_RESEARCH_QUEUE_CONCURRENCY:-3}
      - CHAT_RATE_LIMIT_PER_MINUTE=${CHAT_RATE_LIMIT_PER_MINUTE:-10}
      - DEEP_RESEARCH_RATE_LIMIT_PER_5MIN=${DEEP_RESEARCH_RATE_LIMIT_PER_5MIN:-3}

    env_file:
      - .env

    restart: unless-stopped

    # Note: depends_on removed to allow using external REDIS_URL
    # If using local redis, it will auto-reconnect when redis becomes available
    # If using external REDIS_URL (set in .env), local redis is ignored

    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "run",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==========================================================================
  # Caddy - HTTPS reverse proxy (required by Privy outside localhost)
  # Access CoralGPT at https://<your-server-ip>  (accept self-signed cert in dev)
  # HTTP on :3000 still works for http://localhost only
  # ==========================================================================
  caddy:
    image: caddy:2-alpine
    container_name: bioagents-caddy
    ports:
      - "0.0.0.0:${HTTPS_PORT:-8443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - bioagents
    restart: unless-stopped

  # ==========================================================================
  # Redis - Message broker for BullMQ job queue
  # ==========================================================================
  # NOTE: If using external Redis (set REDIS_URL in .env), this local redis
  # will still start but won't be used. The API connects to whatever REDIS_URL points to.
  # To disable local redis entirely, comment out this service in Coolify.
  redis:
    image: redis:7-alpine
    container_name: bioagents-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    ports:
      - "0.0.0.0:${REDIS_PORT:-6379}:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

# Named volumes for persistent storage
volumes:
  supabase_tmp:
    driver: local
  bioagents-images:
    driver: local
  redis-data:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local