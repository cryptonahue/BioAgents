<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{SEO_TITLE}}</title>
    <meta name="description" content="{{SEO_DESCRIPTION}}">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{{FAVICON_URL}}">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{SEO_TITLE}}">
    <meta property="og:description" content="{{SEO_DESCRIPTION}}">
    <meta property="og:image" content="{{OG_IMAGE_URL}}">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{SEO_TITLE}}">
    <meta name="twitter:description" content="{{SEO_DESCRIPTION}}">
    <meta name="twitter:image" content="{{OG_IMAGE_URL}}">
    <!--
      Theme bootstrap. Runs before first paint so a stored "light" preference
      does not flash the dark UI (and vice versa). The <html> element ships
      with class="dark", so doing nothing here keeps the historical dark-only
      look. Keep the storage key in sync with client/src/contexts/ThemeContext.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('bioagents.theme');
          if (stored === 'light') {
            document.documentElement.classList.remove('dark');
          } else if (stored === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          /* localStorage can throw in private mode / sandboxed iframes. */
        }
      })();
    </script>
    <!-- Self-hosted IBM Plex Sans @font-face rules. Kept out of the bundled
         CSS because Bun base64-inlines every font it sees in a url(); see
         client/public/fonts/fonts.css. Preconnect is unnecessary — same origin. -->
    <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/ibm-plex-sans-latin-400-normal.woff2" crossorigin>
    <link rel="stylesheet" href="/assets/fonts/fonts.css">
    <link rel="stylesheet" href="/index.css">
    <script>
      (function () {
        var c = globalThis.crypto;
        if (!c || typeof c.randomUUID === 'function') return;
        c.randomUUID = function () {
          var bytes = new Uint8Array(16);
          c.getRandomValues(bytes);
          bytes[6] = (bytes[6] & 0x0f) | 0x40;
          bytes[8] = (bytes[8] & 0x3f) | 0x80;
          var hex = Array.from(bytes, function (b) {
            return b.toString(16).padStart(2, '0');
          }).join('');
          return hex.slice(0, 8) + '-' + hex.slice(8, 12) + '-' + hex.slice(12, 16) + '-' + hex.slice(16, 20) + '-' + hex.slice(20);
        };
      })();
    </script>
</head>
<body>
    <div id="app"></div>
    <script type="module" src="/index.js"></script>
</body>
</html>
